stages:
  ingest_backblaze_data:
    cmd: python3 -m src.data.download_backblaze --quarter Q1 --year 2024
    deps:
      - src/data/download_backblaze.py
      - src/data/validate.py
      - params.yaml
    params:
      - data
    outs:
      - data/raw/backblaze_telemetry.parquet:
          cache: true

  train:
    cmd: python3 -m src.models.train
    deps:
      - data/raw/backblaze_telemetry.parquet
      - src/data/features.py
      - src/models/train.py
      - params.yaml
    params:
      - data
      - features
      - training
    outs:
      - models/lgb_model.joblib:
          cache: true
      - data/reference/reference_features.parquet:
          cache: true
    metrics:
      - models/metrics.json:
          cache: false
