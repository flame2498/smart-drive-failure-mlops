name: MLOps CI/CD Quality Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test_and_lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Code Linting with Ruff
        run: |
          ruff check src/ tests/

      - name: Generate Baseline Benchmark & Train Artifacts
        run: |
          python -m src.data.generate_sample
          python -m src.models.train

      - name: Run Test Suite & Latency Assertions
        run: |
          pytest tests/ -v
